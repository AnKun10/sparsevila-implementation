[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparsevila"
version = "0.1.0"
description = "Reference implementation of SparseVILA (ICCV 2025) on LLaVA-1.5"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    # Pinned to LLaVA-1.5's expected version (third_party/LLaVA/pyproject.toml).
    # Newer transformers (4.40+) break LLaVA's pre-4.38-era forward signature
    # via cache_position and stricter _validate_model_kwargs.
    "transformers==4.37.2",
    "tokenizers==0.15.1",
    "Pillow",
    "sentencepiece",
    "accelerate>=0.21,<1.0",
    "einops",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-mock", "ruff"]
notebook = ["jupyter", "ipywidgets"]
cuda = ["triton>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sparsevila*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cuda: requires CUDA GPU",
    "slow: requires real model load",
]
